<section class="kanto-region">
    <h1>Kanto Region</h1>

    <div class="card-grid">
        @for (leader of KantoGymLeaders(); track leader.name) {
            <app-leader-info 
                [name]="leader.name"
                [location]="leader.location"
                [gymBadge]="leader.badge"
                [typeColor]="leader.typeColor"
                [pokemonTeam]="leader.pokemonteam"
                [motto]="leader.motto">
            </app-leader-info>
        }
    </div>
</section>
